<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;min-height:100dvh;display:grid;place-items:center;padding:12px;
  background:radial-gradient(circle at top,#2f3346 0,#1a1c25 38%,#0d0f15 100%);
  color:#f8f8fb;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
img{max-width:100%}
.hidden{display:none!important}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.phone{
  --phone-w:min(402px,calc(100vw - 24px),calc((100dvh - 24px) * 402 / 874));
  position:relative;width:var(--phone-w);aspect-ratio:402/874;max-height:calc(100dvh - 24px);
  border-radius:58px;overflow:hidden;background:#080808;
  border:9px solid #1f2025;
  box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08);
  isolation:isolate
}
#surface{position:absolute;inset:0;overflow:hidden;background:#000;isolation:isolate}
.screen{position:absolute;inset:0;z-index:2}
.wallpaper{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0;transition:opacity .7s ease}
.lock-wall{background-image:url("assets/lock-screen.jpg")}
.home-wall{background-image:url("assets/home-screen.jpg")}
.wall-shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.22) 0,rgba(0,0,0,.04) 26%,rgba(0,0,0,.06) 60%,rgba(0,0,0,.32) 100%);transition:opacity .6s}
.gloss{position:absolute;inset:0;z-index:200;pointer-events:none;background:linear-gradient(130deg,rgba(255,255,255,.08) 0%,rgba(255,255,255,0) 18%,rgba(255,255,255,0) 62%,rgba(255,255,255,.05) 100%);mix-blend-mode:screen;opacity:.35}
.statusbar{position:absolute;top:0;left:0;right:0;height:46px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:8px 26px 0;font-size:14px;font-weight:600;letter-spacing:.2px;color:#fff;pointer-events:none;transition:color .3s}

.statusbar .sb-time{min-width:44px}
.sb-right{display:flex;align-items:center;gap:5px}
.sb-signal{width:17px;height:11px;fill:currentColor}
.sb-battery{position:relative;width:23px;height:11.5px;border:1.4px solid currentColor;border-radius:3.5px;opacity:.92}
.sb-battery::after{content:"";position:absolute;right:-4px;top:2.8px;width:2px;height:4.6px;border-radius:0 2px 2px 0;background:currentColor;opacity:.55}
.sb-battery i{position:absolute;inset:1.4px;right:6px;background:currentColor;border-radius:2px}
.sb-5g{font-size:10.5px;font-weight:700}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:126px;height:36px;border-radius:25px;background:#050505;z-index:80;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.island::after{content:"";position:absolute;right:10px;top:9px;width:6px;height:6px;border-radius:50%;background:#0b1710;box-shadow:inset 0 0 4px rgba(50,140,80,.55)}
.home-indicator{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:170px;height:26px;z-index:75;background:transparent}
.home-indicator::before{content:"";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);width:132px;height:5px;border-radius:4px;background:rgba(255,255,255,.9);transition:background .3s;box-shadow:0 0 6px rgba(0,0,0,.18)}
.home-indicator.light::before{background:rgba(0,0,0,.72)}
.home-indicator:active::before{background:rgba(255,255,255,.6)}
.toast{position:absolute;left:50%;bottom:58px;z-index:125;transform:translateX(-50%) translateY(10px);max-width:82%;padding:10px 16px;border-radius:18px;background:rgba(28,30,38,.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:12.5px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.flashlight{position:absolute;inset:0;z-index:190;background:#fff;opacity:0;transition:opacity .25s}
.flashlight.on{opacity:.94}
.viewer{position:absolute;inset:0;z-index:150;background:#000;display:flex;flex-direction:column;padding:54px 16px 30px}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#fff;font-size:12px;opacity:.7;padding:0 4px 10px}
.viewer-stage{flex:1;display:grid;place-items:center;min-height:0}
.viewer-card{width:100%;max-width:340px;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:#101014;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.viewer-card img{width:100%;height:100%;object-fit:cover;display:block}
.viewer-cap{text-align:center;font-size:12px;opacity:.6;padding-top:12px;min-height:34px}
.viewer-nav{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
.viewer-btn{color:#fff;font-size:13px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.12)}
.viewer-btn:disabled{opacity:.25}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.72}50%{transform:translateY(-3px);opacity:.95}}
.desk-hint{margin:0;font-size:11.5px;color:rgba(255,255,255,.42);letter-spacing:.2px;text-align:center;max-width:360px}
@media (max-height:760px){.desk-hint{display:none}.app{padding:6px}}
@media (max-width:420px){.desk-hint{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.05s!important}}
.lock{position:absolute;inset:0;z-index:4;padding:0;text-align:center;transition:opacity .35s,transform .35s}
.lock.slide-up{opacity:0;transform:translateY(-24px)}
.lock-top{position:absolute;top:0;left:0;right:0}
.lock-date{position:absolute;top:84px;width:100%;font-size:20px;font-weight:500;text-transform:capitalize;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.lock-clock{position:absolute;top:104px;width:100%;font-size:94px;line-height:1;letter-spacing:-5px;font-weight:250;text-shadow:0 2px 14px rgba(0,0,0,.28);font-variant-numeric:tabular-nums}
.lock-notifs{position:absolute;left:18px;right:18px;bottom:132px;display:grid;gap:10px;text-align:left;max-height:42%;overflow:auto;scrollbar-width:none}
.lock-notifs::-webkit-scrollbar{display:none}
.lock-notif{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;border-radius:22px;background:rgba(240,240,245,.55);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);color:#111;box-shadow:0 8px 30px rgba(0,0,0,.12);cursor:pointer;animation:lockNotifArrival .52s cubic-bezier(.2,.9,.22,1.12) both;transform-origin:top center;overflow:hidden}
.lock-notif:active{background:rgba(240,240,245,.7)}
.lock-notif .nt-ic{width:38px;height:38px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;background:#25d366}
.lock-notif .nt-ic img{width:100%;height:100%;object-fit:cover}
.lock-notif .nt-ic.sys{background:rgba(0,0,0,.12)}
.lock-notif .nt-main{flex:1;min-width:0}
.lock-notif .nt-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:4px;color:rgba(0,0,0,.62);font-weight:700}
.lock-notif .nt-top small{font-weight:400;opacity:.7;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.lock-notif .nt-body{font-size:14px;line-height:1.25;color:#111;font-weight:600;display:block;margin-top:2px}
.lock-notif .nt-body span{display:block;font-size:13px;line-height:1.32;color:rgba(0,0,0,.82);font-weight:400;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.lock-bottom{position:absolute;bottom:34px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:center}
.lock-round{width:51px;height:51px;border-radius:50%;display:grid;place-items:center;background:rgba(33,35,39,.44);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:0;color:#fff;font-size:23px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:transform .15s,background .2s}
.lock-round:active{transform:scale(1.15);background:rgba(255,255,255,.35)}
.lock-round.on{background:#fff;color:#111}
.lock-hint{position:absolute;bottom:100px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;opacity:.92;cursor:pointer;text-shadow:0 1px 8px rgba(0,0,0,.55);animation:bob 2.8s ease-in-out infinite,pulseHint 2s ease-in-out infinite;border-radius:999px;padding:8px 14px}
@keyframes pulseHint{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.hint-arrow{font-size:16px;line-height:1;opacity:.9}
.pass{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(27,31,44,.28);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);animation:fadeIn .3s;padding:24px}
.pass-title{font-size:18px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.2)}
.dots{display:flex;justify-content:center;gap:16px;margin:22px 0 18px}
.dot{width:13px;height:13px;border-radius:50%;border:1.8px solid #fff;transition:background .12s,transform .12s}
.dot.filled{background:#fff;transform:scale(1.06)}
.pass-error{height:18px;font-size:13px;color:#ffe1e1;margin-top:4px;text-align:center;line-height:1.3;min-height:18px}
.pass.shake{animation:shake .4s}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 18px;max-width:282px;margin:26px auto 14px}
.key{width:70px;height:70px;justify-self:center;border-radius:50%;border:0;background:rgba(255,255,255,.24);color:#fff;font-size:31px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .12s,transform .1s}
.key:active{background:rgba(255,255,255,.38);transform:scale(.965)}
.key-number{font-size:31px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.key-letters{font-size:8.5px;letter-spacing:1.4px;opacity:.62;margin-top:1px;font-weight:600}
.key.key-empty{background:none;pointer-events:none;box-shadow:none}
.key.key-back{background:rgba(255,255,255,.12)}
.key.key-back:active{background:rgba(255,255,255,.3)}
.key svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pass-actions{display:flex;justify-content:space-between;width:100%;max-width:282px;margin-top:16px;font-size:12.5px;color:#cfe2ff}
.pass-actions button:active{opacity:.55}
.pass-hint{font-size:10.5px;color:rgba(255,255,255,.55);margin-top:6px;text-align:center;min-height:14px}
@keyframes lockNotifArrival{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media (max-height:770px){
  .lock{padding-top:0}
  .lock-date{top:76px;font-size:18px}
  .lock-clock{top:96px;font-size:82px}
  .lock-notifs{bottom:124px;gap:8px}
  .lock-notif{padding:11px 13px}
  .lock-hint{bottom:92px}
  .key{width:62px;height:62px;font-size:28px}
  .keypad{gap:8px 16px;max-width:260px}
  .pass{padding:24px}
}
@media (max-width:420px){
  .lock-date{top:72px}
  .lock-clock{top:90px;font-size:78px}
  .lock-notifs{left:14px;right:14px;bottom:118px}
}
.home{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;padding:93px 26px 26px;overflow:auto;scrollbar-width:none;animation:fadeIn .35s}
.home::-webkit-scrollbar{display:none}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:17px}
.widget{position:relative;border-radius:21px;padding:12px 13px;min-height:148px;overflow:hidden;text-align:left;border:1px solid rgba(255,255,255,.12);animation:riseIn .5s ease both;box-shadow:0 12px 30px rgba(0,0,0,.22)}
.widget-weather{background:linear-gradient(155deg,rgba(48,86,140,.92),rgba(20,34,62,.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;color:#fff}
.w-head{display:flex;justify-content:space-between;gap:6px;font-size:9px;font-weight:700;letter-spacing:1.1px;opacity:.8}
.w-main{display:flex;align-items:flex-start;justify-content:space-between;margin-top:2px}
.w-temp{font-size:39px;font-weight:300;line-height:1.12;letter-spacing:-1.5px}
.w-icon{margin-top:4px;opacity:.95}
.w-icon svg{display:block}
.w-cond{font-size:11.5px;font-weight:600;margin-top:auto}
.w-range{font-size:9.5px;opacity:.72;margin-top:3px;letter-spacing:.2px}
.widget-notes{background:linear-gradient(155deg,#fbf6e4,#eee2bd);color:#2b2418;display:flex;flex-direction:column}
.nw-head{font-size:9px;font-weight:800;letter-spacing:1.1px;color:#a9862f;display:flex;align-items:center;gap:5px}
.nw-title{font-size:12.5px;font-weight:700;margin-top:8px;color:#3a2f18}
.nw-line{font-size:10.5px;opacity:.72;line-height:1.5;padding-left:12px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nw-line::before{content:"";position:absolute;left:1px;top:6px;width:4px;height:4px;border-radius:50%;background:#c6a34a}
.nw-foot{font-size:9.5px;color:#9b7a28;margin-top:auto;font-weight:600}
.appgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px;row-gap:34px;justify-items:center;align-items:start;padding:0 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;min-width:0;padding:4px 2px;font-size:11px;font-weight:500;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.75);cursor:pointer;user-select:none}
.app:active .appicon{transform:scale(.9);filter:brightness(.96)}
.appicon{width:56px;height:56px;aspect-ratio:1/1;flex:none;border-radius:15px;display:grid;place-items:center;font-size:26px;box-shadow:0 7px 14px rgba(0,0,0,.22),0 0 0 .5px rgba(255,255,255,.14) inset;overflow:hidden;transition:transform .14s ease,filter .14s ease;background:transparent;position:relative;opacity:1;visibility:visible}
.appicon img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.app span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{position:absolute;left:18px;right:18px;bottom:24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-items:center;align-items:center;padding:13px 8px;border-radius:31px;background:rgba(244,245,250,.28);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 24px rgba(0,0,0,.25);z-index:10;overflow:visible;opacity:1;visibility:visible}
.dock .app span{display:none}
.dock .app{gap:0;opacity:1;visibility:visible;pointer-events:auto;position:relative;z-index:2}
.dock .appicon{width:55px;height:55px;opacity:1;visibility:visible;pointer-events:auto;position:relative;z-index:2;box-shadow:0 6px 14px rgba(0,0,0,.28),0 0 0 .5px rgba(255,255,255,.18) inset}
.dock .ic{opacity:1;visibility:visible}
.ic{width:100%;height:100%;display:grid;place-items:center;position:relative}
.ic svg{display:block}
.ic-cal{background:#fff;color:#111;flex-direction:column;line-height:1}
.ic-cal b{font-size:8px;letter-spacing:.6px;color:#ff3b30;font-weight:700;margin-top:7px}
.ic-cal strong{font-size:22px;font-weight:400;letter-spacing:-.5px;margin-top:1px}
.ic-notes{background:linear-gradient(180deg,#fefefe,#f4f1e8)}

.ic-wa{background:#25d366;box-shadow:inset 0 -2px 4px rgba(0,0,0,.18)}
.ic-memo{background:linear-gradient(180deg,#3a3a3e,#101013)}
.ic-photos{background:#fff}
.ic-music{background:linear-gradient(160deg,#fa586a,#f72f4f)}
.ic-phone{background:linear-gradient(180deg,#54e878,#23b64d)}
.ic-safari{background:radial-gradient(circle at 30% 30%,#90ecff,#4bb4ff 45%,#0b71f3 78%)}

}
.wa{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;background:#fff;color:#101114}
.wa-top{flex:0 0 auto;padding:50px 14px 0;background:rgba(250,250,250,.96);backdrop-filter:blur(20px);border-bottom:.5px solid rgba(0,0,0,.1)}

.wa-chathead{position:relative;z-index:3;flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:50px 10px 9px;background:rgba(250,250,250,.94);backdrop-filter:blur(20px);border-bottom:.5px solid rgba(0,0,0,.1)}
.wa-back{color:#0a7cff;font-size:21px;line-height:1;padding:4px 4px 4px 0;display:grid;place-items:center}
.wa-back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.wa-chathead .wa-avatar{width:36px;height:36px;font-size:14px}
.wa-chat-title{flex:1;min-width:0;line-height:1.2}
.wa-chatname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-chatstatus{font-size:10.5px;color:#7c7c85;margin-top:1px}
.wa-head-actions{display:flex;gap:14px;color:#0a7cff;padding-right:2px}
.wa-head-actions svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wa-convo{position:relative;z-index:2;flex:1;overflow:auto;padding:12px 10px 10px;scrollbar-width:none;display:flex;flex-direction:column;gap:3px}
.wa-convo::-webkit-scrollbar{display:none}
.wa-day{position:sticky;top:0;align-self:center;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);color:#6b6b73;font-size:10px;font-weight:600;padding:4px 10px;border-radius:8px;margin:4px 0 8px;box-shadow:0 1px 1px rgba(0,0,0,.06);z-index:2}
.wa-bubble{position:relative;max-width:78%;padding:6px 9px 16px;border-radius:11px;background:#fff;font-size:12.5px;line-height:1.4;box-shadow:0 1px .5px rgba(0,0,0,.13);align-self:flex-start;word-wrap:break-word;animation:riseIn .18s ease both}
.wa-bubble.mine{align-self:flex-end;background:#d9fdd3}
.wa-bubble .btime{position:absolute;right:8px;bottom:4px;font-size:9px;color:#8b8b93;letter-spacing:.1px}
.wa-bubble.mine .btime{color:#5f8a6a}
.wa-bubble.mine .btime .tick{font-size:9px;margin-left:2px;color:#3f9c5c}
.wa-system{align-self:center;background:rgba(255,255,255,.82);color:#6f6f77;font-size:10.5px;padding:5px 11px;border-radius:9px;margin:8px 0;text-align:center;max-width:88%;line-height:1.4}
.wa-img{display:block;width:100%;max-width:220px;border-radius:8px;margin-bottom:4px}
.wa-bubble.has-img{padding:3px 3px 16px}
.wa-bubble.has-img .btime{right:9px}
.wa-typing{align-self:flex-start;background:#fff;border-radius:11px;padding:9px 13px;display:flex;gap:4px;box-shadow:0 1px .5px rgba(0,0,0,.13)}
.wa-typing i{width:6px;height:6px;border-radius:50%;background:#b3b3ba;animation:tdot 1.1s infinite}
.wa-typing i:nth-child(2){animation-delay:.15s}.wa-typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

.wa-composer-wrap{position:relative;z-index:4;flex:0 0 auto;background:#f6f4f1;border-top:.5px solid rgba(0,0,0,.08);padding:8px 8px 8px;transition:transform .28s ease}
.wa-chat.kb-open .wa-composer-wrap{transform:translateY(-238px)}
.wa-chat.kb-open .wa-convo{padding-bottom:230px}
.wa-choices{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.wa-choices::-webkit-scrollbar{display:none}
.wa-choice{flex:0 0 auto;max-width:250px;font-size:12px;line-height:1.3;padding:8px 12px;border-radius:16px;border:1px solid #b9e2c5;background:#f2fcf5;color:#0d6b36;text-align:left;animation:riseIn .22s both;white-space:normal}
.wa-choice:active{background:#dcf7e5}
.wa-composer{display:flex;align-items:flex-end;gap:7px}
.wa-plus{width:32px;height:32px;border-radius:50%;background:#e9e6e1;color:#5c5c63;font-size:22px;line-height:1;display:grid;place-items:center;flex:0 0 auto;margin-bottom:2px}
.wa-field{flex:1;display:flex;align-items:center;background:#fff;border-radius:20px;padding:7px 12px;min-height:36px;border:.5px solid rgba(0,0,0,.08)}
.wa-field input{width:100%;border:0;outline:none;background:none;font-size:13px;line-height:1.3}
.wa-send{width:34px;height:34px;border-radius:50%;background:#25a55a;color:#fff;display:grid;place-items:center;flex:0 0 auto;margin-bottom:1px}
.wa-send svg{width:19px;height:19px;fill:currentColor}
.wa-send:active{transform:scale(.93)}
.wa-kb{position:absolute;left:0;right:0;bottom:0;z-index:3;height:238px;background:#d1d4d9;padding:6px 5px 4px;transform:translateY(100%);transition:transform .28s ease;display:flex;flex-direction:column;gap:6px}
.wa-chat.kb-open .wa-kb{transform:translateY(0)}
.wa-kb-row{display:flex;justify-content:center;gap:5px;flex:1}
.wa-kb-key{flex:1;max-width:36px;background:#fff;border-radius:5px;box-shadow:0 1px 0 rgba(0,0,0,.28);font-size:15px;display:grid;place-items:center;color:#111;transition:background .08s}
.wa-kb-key.special{max-width:44px;background:#adb3bd;font-size:11px;font-weight:600}
.wa-kb-key.space{max-width:180px;background:#fff;font-size:11px;color:#444}
.wa-kb-key.pressed{background:#a9c8ff}
.wa-kb-row{} /* keep */
.wa-kb-footer{display:flex;justify-content:space-between;align-items:center;padding:0 10px;height:20px;color:#5c6068;font-size:13px}
.wa-kb-footer button{color:#3b3f47;font-size:11px;font-weight:600}
.wa-chat-note{padding:8px 12px;font-size:11px;color:#8a8a93;text-align:center;background:#f6f4f1;border-top:.5px solid rgba(0,0,0,.08)}
@media (max-width:370px){
  .wa-chat.kb-open .wa-composer-wrap{transform:translateY(-224px)}
  .wa-kb{height:224px}
  .wa-kb-key{font-size:14px}
}

.notes-list{padding:4px 16px 10px}

.cal-wrap{padding:6px 14px 22px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 12px}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;padding-top:5px}

.cal-note{font-size:10.5px;color:#9a9aa1;text-align:center;padding:12px 18px 0;line-height:1.5}

<div class="app">

<span class="hint-arrow">&#8963;</span>
<span>Ketuk untuk membuka</span>

          </button>

      <section id="home" class="screen home hidden">
        <div class="widgets">

            <div class="w-head"><span>JOGJA</span><span id="wUpdated">SEKARANG</span></div>

        <div class="appgrid" id="appgrid"></div>
        <div class="dock" id="dock"></div>

      <button class="home-indicator" id="homeIndicator" aria-label="Kembali ke layar utama"></button>

      <div class="banner" id="banner" role="button" tabindex="0" aria-label="Notifikasi"></div>

      <section class="call hidden" id="call" aria-label="Panggilan"></section>
      <section class="scene hidden" id="scene" aria-label="Adegan"></section>
      <section class="ending hidden" id="ending" aria-label="Akhir cerita"></section>

  </main>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CHAPTERS = [
  { date: 'Kamis, 14 Mei',  minute: 22 * 60 + 15 },
  { date: 'Jumat, 15 Mei',  minute: 7 * 60 + 40 },
  { date: 'Jumat, 15 Mei',  minute: 23 * 60 + 10 },

const SAVE_KEY = 'jakarta-jogja.v1';
let S = loadState();
let CURRENT_SCREEN = 'lock';

function defaultState(){
  return {
    v: 1,
    chapter: 0,
    minute: CHAPTERS[0].minute,
    chats: seedChats(),
    unread: { jo: 1, dinda: 0, bayu: 1, mama: 0 },
    flags: {},
    notes: [],
    cameraShots: [],
    ended: null,
    epilogue: false
  };
}

function loadState(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== 1) return defaultState();
    const base = defaultState();
    return Object.assign(base, parsed, {
      chats: Object.assign(base.chats, parsed.chats || {}),
      unread: Object.assign(base.unread, parsed.unread || {}),
      flags: parsed.flags || {},
      notes: parsed.notes || [],
      cameraShots: parsed.cameraShots || []
    });
  } catch (e) { return defaultState(); }
}

function saveState(){
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(() => {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
  }, 180);
}

function resetStory(){

function fmtMin(m){
  m = ((Math.round(m) % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + '.' + String(m % 60).padStart(2, '0');
}
function clockNow(){ return fmtMin(S.minute); }
function bumpClock(n){ S.minute = (S.minute + (n || 1)) % 1440; renderClock(); }
function chapterInfo(){ return CHAPTERS[clamp(S.chapter, 0, CHAPTERS.length - 1)]; }

function renderClock(){
  const t = fmtMin(S.minute);
  $('sbTime').textContent = t;
  $('lockClock').textContent = t;
  $('lockDate').textContent = chapterInfo().date;
}

function setChapter(n){

function setStatusTheme(light){
  $('statusbar') && $('statusbar').classList.toggle('light', !!light);
  $('homeIndicator') && $('homeIndicator').classList.toggle('light', !!light);
}

function showScreen(name){
  const ids = ['lock', 'pass', 'home', 'appPage'];
  ids.forEach(id => $(id).classList.toggle('hidden', id !== name));
  CURRENT_SCREEN = name;
  const homeVisible = name === 'home' || name === 'appPage';
  $('wallLock').classList.toggle('hidden', homeVisible);
  $('wallHome').classList.toggle('hidden', !homeVisible);
  if (!homeVisible) setStatusTheme(false);
  if (name === 'lock') {
    $('lock').classList.remove('slide-up');
    renderLockNotifs();
    renderClock();
  }
  if (name === 'home') { ACTIVE_CHAT = null; CURRENT_APP = null; setStatusTheme(false); }
}

function pressDigit(n){
  if (passEntry.length >= 4) return;
  ensureAudio();
  passEntry += String(n);
  renderDots();
  if (passEntry.length === 4) setTimeout(checkPass, 130);
}
function backDigit(){
  if (!passEntry.length) return;
  passEntry = passEntry.slice(0, -1);

}
function renderKeypad(){
  const kp = $('keypad');
  if (!kp) return;
  const rows = [
    [{n:'1',l:''},{n:'2',l:'ABC'},{n:'3',l:'DEF'}],
    [{n:'4',l:'GHI'},{n:'5',l:'JKL'},{n:'6',l:'MNO'}],
    [{n:'7',l:'PQRS'},{n:'8',l:'TUV'},{n:'9',l:'WXYZ'}]
  ];
  let html = '';
  rows.forEach(r => r.forEach(k => {
    html += `<button class="key" onclick="pressDigit('${k.n}')" aria-label="Angka ${k.n}"><span class="key-number">${k.n}</span><span class="key-letters">${k.l}</span></button>`;

function checkPass(){
  if (passEntry === '2907') {
    passEntry = '';
    $('passError').textContent = '';
    showScreen('home');
    const action = pendingUnlockAction;
    pendingUnlockAction = null;
    onUnlocked();
    if (action) setTimeout(action, 220);
    saveState();
  } else {
    passAttempts++;
    passEntry = '';
    renderDots();
    $('passError').textContent = passAttempts >= 3
? 'Petunjuk: 29/07.'
: 'Kode sandi salah. Coba lagi.';
    const pass = $('pass');
    pass.classList.remove('shake');
    void pass.offsetWidth;
    pass.classList.add('shake');
    try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
    setTimeout(() => pass.classList.remove('shake'), 450);
  }
}

let audioCtx = null;
function ensureAudio(){
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function tone(freq, start, dur, vol){
  const ac = ensureAudio();
  if (!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = 'sine';
  o.frequency.value = freq;
  o.connect(g); g.connect(ac.destination);
  const t0 = ac.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.08, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfxNotif(){
  tone(880, 0, 0.16, 0.05);
  tone(1174.7, 0.14, 0.24, 0.045);
}
function sfxSend(){

}
let RING_TIMER = null;
function startRingtone(){
  stopRingtone();
  const play = () => {
    tone(659.3, 0, 0.32, 0.06);
    tone(783.99, 0.36, 0.32, 0.06);
  };
  play();
  RING_TIMER = setInterval(play, 1400);
}
function stopRingtone(){ if (RING_TIMER) { clearInterval(RING_TIMER); RING_TIMER = null; } }

function vibrate(pattern){ try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {} }

function timeSkip(kicker, title, sub, duration){
  return new Promise(resolve => {
    const el = $('timeskip');
    $('tsKicker').textContent = kicker || '';
    $('tsTitle').textContent = title || '';
    $('tsSub').textContent = sub || '';
    el.classList.add('show');
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      el.classList.remove('show');
      el.onclick = null;
      setTimeout(resolve, 380);
    };
    el.onclick = finish;
    setTimeout(finish, duration || 2800);
  });
}

async function loadWeather(){
  const fallback = { temp: 27, cond: 'Hujan ringan', min: 24, max: 30 };
  renderWeather(fallback, true);
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 6500);
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=-7.7956&longitude=110.3695'
      + '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min'
      + '&timezone=Asia%2FJakarta&forecast_days=1';
    const res = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!res.ok) return;
    const d = await res.json();
    if (!d || !d.current) return;
    WEATHER_DATA = d;
    renderWeather({
      temp: Math.round(d.current.temperature_2m),
      cond: weatherText(d.current.weather_code),
      min: Math.round(d.daily.temperature_2m_min[0]),
      max: Math.round(d.daily.temperature_2m_max[0]),
      code: d.current.weather_code
    }, false);
  } catch (e) {}
}

function weatherText(code){
  if (code === 0) return 'Cerah';
  if (code <= 2) return 'Cerah berawan';
  if (code === 3) return 'Berawan';
  if (code === 45 || code === 48) return 'Berkabut';
  if (code >= 51 && code <= 57) return 'Gerimis';
  if (code >= 61 && code <= 67) return 'Hujan';
  if (code >= 80 && code <= 82) return 'Hujan deras';
  if (code >= 95) return 'Hujan petir';
  return 'Berawan';
}
function weatherIcon(code){
  if (code === 0) return `<svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="8" fill="#ffd166"/><g stroke="#ffd166" stroke-width="2" stroke-linecap="round"><path d="M20 5v4M20 31v4M5 20h4M31 20h4M9.4 9.4l2.8 2.8M27.8 27.8l2.8 2.8M30.6 9.4l-2.8 2.8M12.2 27.8l-2.8 2.8"/></g></svg>`;
  if (code >= 51) return `<svg width="44" height="40" viewBox="0 0 44 40" fill="none"><path d="M12 25a7 7 0 0 1 .8-13.9A9.5 9.5 0 0 1 31 13a6.5 6.5 0 0 1 1 12.9" fill="#dfe8f5" opacity=".92"/><g stroke="#7fb6ff" stroke-width="2.2" stroke-linecap="round"><path d="M15 30l-2 5M23 30l-2 5M31 30l-2 5"/></g></svg>`;
  return `<svg width="44" height="40" viewBox="0 0 44 40" fill="none"><path d="M12 26a7.5 7.5 0 0 1 .7-15A10 10 0 0 1 32 13.6 7 7 0 0 1 33 27.6" fill="#e9eef6" opacity=".95"/></svg>`;
}
function renderWeather(data, fallback){
  const t = $('wTemp'), c = $('wCond'), r = $('wRange'), i = $('wIcon'), u = $('wUpdated');
  if (!t) return;
  t.textContent = data.temp + '\u00B0';
  c.textContent = data.cond;
  r.textContent = data.min + '\u00B0 / ' + data.max + '\u00B0 \u00B7 prakiraan';
  i.innerHTML = weatherIcon(data.code == null ? 61 : data.code);
  u.textContent = fallback ? 'LURING' : 'LIVE';
}

function pushMessage(chatId, m, opts){

    if (!opts.silentBanner) bannerMsg(chatId, m.text || 'Mengirim foto', m.time);
  }
  saveState();
  if (isChatOpen(chatId)) {
    if (opts.fullRender) { renderChat(chatId); return; }
    const c = $('waConversation');
    if (c) { c.insertAdjacentHTML('beforeend', bubbleHTML(m)); scrollConvo(); }

}

    showTyping();
    await sleep(dur);
    hideTyping();
    const m = msg('them', text, opts.time || clockNow(), opts.extra || {});
    pushMessage(chatId, m, { fullRender: false });
    bumpClock(1);
    await sleep(opts.after != null ? opts.after : 260);
    return m;
  })();
}

const CALL_ABORT = { abort: 'call-aborted' };

function startCall(opts){
  opts = opts || {};
  if (CALL_BUSY) return Promise.resolve('busy');
  CALL_BUSY = true;
  ensureAudio();
  const contactId = opts.contactId || 'jo';
  const c = CONTACTS[contactId];
  const el = $('call');
  const kindLabel = opts.kind === 'voice' ? 'Panggilan suara' : 'Panggilan video';
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="call-bg"></div>
    <div class="call-shade"></div>
    <div class="call-inner">
      <div class="call-status" id="callStatus">${kindLabel} masuk</div>
      <div class="call-name">${esc(c.name)}</div>
      <div class="call-sub" id="callSub">seluler</div>
      <img class="call-photo" id="callPhoto" src="${c.img || IMG.jo}" alt="Foto ${esc(c.name)}">
      <div class="call-transcript" id="callTranscript"></div>
      <div class="call-choices" id="callChoices"></div>
      <div class="call-controls" id="callControls"></div>
    </div>`;

  return new Promise(resolve => {
    let answered = false;
    let finished = false;
    let seconds = 0;
    let timer = null;
    let autoMiss = null;
    let abortResolve = null;
    let pendingChoice = null;
    const abortPromise = new Promise(res => { abortResolve = res; });
    const state = { aborted: false };

    const sub = $('callSub');
    const transcript = $('callTranscript');
    const choicesEl = $('callChoices');
    const controls = $('callControls');

    function paintIncomingControls(){
      controls.innerHTML = `
        <button class="cbtn" onclick="declineCall()" aria-label="Tolak">
          <span class="cb red"><svg viewBox="0 0 24 24"><path d="M12 9.5c-3.2 0-6.1.9-8.6 2.5-.4.3-.6.7-.5 1.2l.5 2.1c.1.5.6.8 1.1.7l2.8-.6c.5-.1.8-.5.8-1v-1.6c1.2-.4 2.5-.6 3.9-.6s2.7.2 3.9.6v1.6c0 .5.3.9.8 1l2.8.6c.5.1 1-.2 1.1-.7l.5-2.1c.1-.5-.1-.9-.5-1.2A16 16 0 0 0 12 9.5Z" transform="rotate(135 12 12)"/></svg></span>
          <span>Tolak</span>
        </button>
        <button class="cbtn" onclick="answerCall()" aria-label="Jawab">
          <span class="cb green call-ring"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.24 1.02l-2.21 2.2Z"/></svg></span>
          <span>Jawab</span>
        </button>`;
    }

    function paintActiveControls(){
      controls.innerHTML = `
        <button class="cbtn" onclick="toggleMute(this)" aria-label="Bisukan">
          <span class="cb"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2Z"/></svg></span>
          <span>Bisukan</span>
        </button>
        <button class="cbtn" onclick="hangupCall()" aria-label="Akhiri">
          <span class="cb red"><svg viewBox="0 0 24 24"><path d="M12 9.5c-3.2 0-6.1.9-8.6 2.5-.4.3-.6.7-.5 1.2l.5 2.1c.1.5.6.8 1.1.7l2.8-.6c.5-.1.8-.5.8-1v-1.6c1.2-.4 2.5-.6 3.9-.6s2.7.2 3.9.6v1.6c0 .5.3.9.8 1l2.8.6c.5.1 1-.2 1.1-.7l.5-2.1c.1-.5-.1-.9-.5-1.2A16 16 0 0 0 12 9.5Z" transform="rotate(135 12 12)"/></svg></span>
          <span>AKHIRI</span>
        </button>
        <button class="cbtn" onclick="toast('Simulasi panggilan')" aria-label="Speaker">
          <span class="cb"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 1-2.5 4v-8a4.5 4.5 0 0 1 2.5 4Zm-2.5-8.8v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg></span>
          <span>Speaker</span>
        </button>`;
    }

    function cleanup(result){
      if (finished) return;
      finished = true;
      state.aborted = true;
      if (abortResolve) abortResolve();
      if (pendingChoice) { try { pendingChoice(CALL_ABORT); } catch (e) {} }
      clearInterval(timer);
      clearTimeout(autoMiss);
      stopRingtone();
      el.style.opacity = '0';
      setTimeout(() => {
        el.classList.add('hidden');
        el.style.opacity = '';
        el.innerHTML = '';
        CALL_BUSY = false;
        resolve(result);
      }, 320);
    }

    function finishWith(result){
      if (finished) return;
      if (result === 'declined' || result === 'missed') {
        pushSystem(contactId, opts.missedLabel || (kindLabel + ' tak terjawab'));
        setTimeout(() => cleanup('declined'), 240);
      } else {
        cleanup('ended');
      }
    }

    window.declineCall = () => { if (!answered) finishWith('declined'); };
    window.answerCall = () => {
      if (answered || finished) return;
      answered = true;
      clearTimeout(autoMiss);
      stopRingtone();
      el.classList.add('chatting');
      $('callStatus').textContent = kindLabel;
      paintActiveControls();
      timer = setInterval(() => {
        seconds++;
        const s = $('callSub');
        if (s) s.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + '.' + String(seconds % 60).padStart(2, '0');
      }, 1000);
      runStory();
    };
    window.hangupCall = () => {
      if (!answered) { finishWith('declined'); return; }
      state.aborted = true;
      if (abortResolve) abortResolve();
      if (pendingChoice) { try { pendingChoice(CALL_ABORT); } catch (e) {} }
      cleanup('ended-by-user');
    };
    window.toggleMute = (btn) => {
      const cb = btn.querySelector('.cb');
      cb.classList.toggle('mute-off');
      const lbl = btn.querySelector('span:last-child');
      if (lbl) lbl.textContent = cb.classList.contains('mute-off') ? 'Bunyikan' : 'Bisukan';
    };

    const ctl = {
      say(who, text){
        return new Promise(async res => {
          if (state.aborted) return res();
          const line = document.createElement('div');
          line.className = 'c-line' + (who === 'me' ? ' me' : who === 'narr' ? ' narr' : '');
          const label = who === 'them' ? c.name : who === 'me' ? 'Kamu' : '';
          line.innerHTML = (label ? `<small>${esc(label)}</small>` : '') + esc(text);
          transcript.appendChild(line);
          transcript.scrollTop = transcript.scrollHeight;
          const dur = clamp(820 + text.length * 26, 1000, 3000);
          await Promise.race([sleep(dur), abortPromise]);
          res();
        });
      },
      choice(options){
        return new Promise(async (res, rej) => {
          if (state.aborted) return rej(CALL_ABORT);
          choicesEl.innerHTML = options.map((o, i) =>
            `<button class="c-choice" data-i="${i}">${esc(o.text)}</button>`).join('');
          const pick = (opt) => {
            choicesEl.innerHTML = '';
            pendingChoice = null;
            if (!state.aborted && opt.send !== false) {
              const line = document.createElement('div');
              line.className = 'c-line me';
              line.innerHTML = `<small>Kamu</small>${esc(opt.text)}`;
              transcript.appendChild(line);
              transcript.scrollTop = transcript.scrollHeight;
            }
            res(state.aborted ? CALL_ABORT : opt);
          };
          pendingChoice = (x) => rej(x);
          Array.from(choicesEl.children).forEach(btn => {
            btn.onclick = () => pick(options[Number(btn.dataset.i)]);
          });
        });
      },
      end(){
        if (finished) return Promise.resolve();
        $('callStatus').textContent = 'Panggilan berakhir';
        $('callChoices').innerHTML = '';
        return sleep(680).then(() => cleanup('ended'));
      },
      status(t){ $('callStatus').textContent = t; }
    };

    async function runStory(){
      try {
        await opts.run(ctl);
      } catch (e) {
        if (e !== CALL_ABORT) console.error(e);
      } finally {
        if (!finished) cleanup('ended');
      }
    }

    paintIncomingControls();
    startRingtone();
    vibrate([120, 80, 120]);
    autoMiss = setTimeout(() => { if (!answered) finishWith('missed'); }, 26000);
  });
}

function sceneEngine(kind, opts){
  const el = kind === 'scene' ? $('scene') : $('call');
  SCENE_BUSY = true;
  el.classList.remove('hidden');
  el.innerHTML = `
    <div class="scene-bg"></div>
    <div class="scene-rain"></div>
    <div class="scene-rain b"></div>
    <div class="scene-inner">
      <div class="scene-kicker">${esc(opts.kicker)}</div>
      <div class="scene-title">${esc(opts.title)}</div>
      <div class="scene-sub">${esc(opts.sub || '')}</div>
      <div class="scene-lines" id="sceneLines"></div>
      <div class="scene-choices" id="sceneChoices"></div>
      <div class="scene-tap">ketuk untuk lanjut</div>
    </div>`;
  const lines = $('sceneLines');
  const choicesEl = $('sceneChoices');
  return new Promise(resolve => {
    const finish = () => {
      el.style.opacity = '0';
      setTimeout(() => {
        el.classList.add('hidden');
        el.style.opacity = '';
        el.innerHTML = '';
        SCENE_BUSY = false;
        resolve();
      }, 600);
    };
    const ctl = {
      say(who, text, ms){
        return new Promise(async res => {
          const line = document.createElement('div');
          line.className = 's-line' + (who === 'me' ? ' me' : who === 'narr' ? ' narr' : '');
          const label = who === 'them' ? 'Jo' : who === 'me' ? 'Kamu' : '';
          line.innerHTML = (label ? `<small>${esc(label)}</small>` : '') + esc(text);
          lines.appendChild(line);
          lines.scrollTop = lines.scrollHeight;
          await sleep(ms != null ? ms : clamp(900 + text.length * 30, 1200, 3600));
          res();
        });
      },
      choice(options){
        return new Promise(res => {
          choicesEl.innerHTML = options.map((o, i) =>
            `<button class="s-choice" data-i="${i}">${esc(o.text)}</button>`).join('');
          Array.from(choicesEl.children).forEach(btn => {
            btn.onclick = () => {
              const opt = options[Number(btn.dataset.i)];
              choicesEl.innerHTML = '';
              if (opt.send !== false) {
                const line = document.createElement('div');
                line.className = 's-line me';
                line.innerHTML = `<small>Kamu</small>${esc(opt.text)}`;
                lines.appendChild(line);
                lines.scrollTop = lines.scrollHeight;
              }
              res(opt);
            };
          });
        });
      },
      close: finish
    };
    (async () => {
      try { await opts.run(ctl); } catch (e) { console.error(e); }
      finish();
    })();
  });
}

    { text: 'Jo, makasih udah datang.', value: 'makasih' },
    { text: 'Kamu gak boleh lupa lagi ya.', value: 'ingat' }
  ]);
  if (b.value === 'makasih') {
    await incoming('jo', 'makasih juga udah maafin aku.');
    await incoming('jo', 'aku catat tanggalnya di kalender. beneran.');
  } else {
    await incoming('jo', 'aku catat. ulang tahun, anniversary, semuanya.');
    await incoming('jo', 'kalau lupa lagi, aku terbang lagi ke Jogja.');
  }
  await incoming('jo', 'sampai kapan pun, kamu penting buat aku.');
  pushSystem('jo', 'Percakapan ini diakhiri. Terima kasih sudah membaca.');
  toast('Cerita selesai. Kamu bisa mulai lagi kapan saja.', 3400);
}

function waListHTML(){
  const q = (WA_QUERY || '').toLowerCase();
  return CONTACT_ORDER.filter(id => {
    const c = CONTACTS[id];
    if (!c) return false;
    if (q && !c.name.toLowerCase().includes(q)) return false;
    if (WA_FILTER === 'unread' && !S.unread[id]) return false;
    return true;
  }).map(id => {
    const c = CONTACTS[id];
    const msgs = S.chats[id] || [];
    const last = msgs[msgs.length - 1];
    const unread = S.unread[id] || 0;
    return `<button class="wa-row${unread ? ' unread' : ''}" onclick="openChat('${id}')">
      <span class="wa-avatar">${contactAvatarInner(id)}</span>
      <span class="wa-main">
        <span class="wa-top"><b>${esc(c.name)}</b><small>${last ? esc(last.time) : ''}</small></span>
        <span class="wa-bot">${last ? esc(last.text) : ''}${unread ? `<span class="badge">${unread}</span>` : ''}</span>
      </span>
    </button>`;
  }).join('');
}

let PHONE_TAB = 'recents';
function phoneTab(tab, btn){

    $$('.phone-tab').forEach(b => b.classList.remove('active'));

  }
  const content = $('phoneContent');
  if (!content) return;
  if (tab === 'recents') content.innerHTML = phoneRecentsHTML();
  else if (tab === 'contacts') content.innerHTML = phoneContactsHTML();
  else if (tab === 'keypad') content.innerHTML = phoneKeypadHTML();

}

function phoneKeypadHTML(){

  </div>`;
}
function phoneVoicemailHTML(){

function setPhotoFilter(f){

function photoGridHTML(){
  const all = [IMG.g1, IMG.g2, IMG.g3, IMG.g4, IMG.g5, IMG.g6, IMG.g7, IMG.g8, IMG.g9];
  const kita = [IMG.g1, IMG.g2, IMG.g3];
  const jogja = [IMG.g4, IMG.g5, IMG.g6, IMG.g7, IMG.g8];
  const kamera = S.cameraShots.length ? S.cameraShots : [IMG.g9];
  let src = all;
  if (PHOTO_FILTER === 'kita') src = kita;
  else if (PHOTO_FILTER === 'jogja') src = jogja;
  else if (PHOTO_FILTER === 'kamera') src = kamera;
  return src.map((s, i) => `<button class="photo-thumb" onclick="openViewer('${s}', ${i})"><img src="${s}" alt=""></button>`).join('');
}

function openViewer(src, idx){
  VIEWER_STATE = { src, idx };
  const v = $('viewer');
  v.classList.remove('hidden');
  v.innerHTML = `<img src="${src}" alt="">`;
  v.onclick = closeViewer;
}

function closeViewer(){
  VIEWER_STATE = null;
  const v = $('viewer');
  v.classList.add('hidden');
  v.innerHTML = '';
  v.onclick = null;
}

function openCamera(){
  mountApp('dark', 'camera-app', `
    <div class="app-inner camera-full">
      <video id="camVideo" autoplay playsinline muted></video>
      <div class="cam-controls">
        <button class="shutter-btn" onclick="takePhoto()" aria-label="Ambil foto"></button>
        <button class="flip-btn" onclick="flipCamera()" aria-label="Putar kamera">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 13c0-4.42-3.58-8-8-8Zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 0 0 4 13c0 4.42 3.58 8 8 8v3l4-4-4-4v3Z"/></svg>
        </button>
      </div>
    </div>`);
  startCamera();
}

async function startCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: CAMERA_FACING },
      audio: false
    });
    CAMERA_STREAM = stream;
    const v = $('camVideo');
    if (v) v.srcObject = stream;
  } catch (e) {
    toast('Kamera tidak dapat diakses.');
  }
}

function stopCamera(){
  if (CAMERA_STREAM) {
    CAMERA_STREAM.getTracks().forEach(t => t.stop());
    CAMERA_STREAM = null;
  }
  const v = $('camVideo');
  if (v) v.srcObject = null;
}

function flipCamera(){
  CAMERA_FACING = CAMERA_FACING === 'user' ? 'environment' : 'user';
  stopCamera();
  startCamera();
}

function takePhoto(){
  const v = $('camVideo');
  if (!v) return;
  const canvas = document.createElement('canvas');
  canvas.width = v.videoWidth || 640;
  canvas.height = v.videoHeight || 480;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(v, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  S.cameraShots.push(dataUrl);
  saveState();
  toast('Foto disimpan.');
}

let MUSIC_PLAYING = false;
function musicToggle(){
  MUSIC_PLAYING = !MUSIC_PLAYING;
  const btn = $('musicPlayBtn');
  const icon = $('musicPlayIcon');
  if (MUSIC_PLAYING) {
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36" fill="#fff"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
    startMusicTimer();
  } else {
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="36" height="36" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
    stopMusicTimer();
  }
}

function startMusicTimer(){
  stopMusicTimer();
  MUSIC_TIMER = setInterval(() => {
    MUSIC_POS = (MUSIC_POS + 1) % 100;
    const bar = $('.music-bar');
    if (bar) bar.style.width = MUSIC_POS + '%';
  }, 1000);
}

function stopMusicTimer(){
  if (MUSIC_TIMER) { clearInterval(MUSIC_TIMER); MUSIC_TIMER = null; }
}

function musicPrev(){ MUSIC_POS = 0; }
function musicNext(){ MUSIC_POS = 0; }
